plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

loom {
	// Storage Preview reads three protected fields off AbstractContainerScreen.
	// See StoragePreview itself for why this is a widener and not a mixin.
	accessWidenerPath = file("src/main/resources/dragsimutils.accesswidener")

	splitEnvironmentSourceSets()
	mods {
		"dragsimutils" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

// Every build records its source commit for reviewers to compare with the jar.
def commit = System.getenv("GITHUB_SHA") ?: providers.exec {
    commandLine 'git', 'rev-parse', 'HEAD'
}.standardOutput.asText.get().trim()

processResources {
    inputs.property "version", project.version
    inputs.property "commit", commit
    filesMatching("fabric.mod.json") {
        expand "version": project.version, "commit": commit
    }
}

sourceSets.test.compileClasspath += sourceSets.client.output + sourceSets.client.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.client.runtimeClasspath

