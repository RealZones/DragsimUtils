tasks.named('test') {
	// Regression runners above do not use a framework; future framework tests still run.
	failOnNoDiscoveredTests = false
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// A separate sources jar lets reviewers inspect the same build's Java files.
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

