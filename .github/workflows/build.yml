name: Build and release

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - LICENSE
      - AGENTS.md
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.info.outputs.version }}
      short: ${{ steps.info.outputs.short }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Read release version
        id: info
        shell: bash
        run: |
          version=$(sed -n 's/^mod_version=//p' gradle.properties)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Build and verify artifacts
        run: |
          ./gradlew --no-daemon --max-workers=2 build
          python3 scripts/verify_artifacts.py
      - name: Stage release downloads
        run: |
          mkdir -p build/release
          cp build/libs/dragsimutils-${{ steps.info.outputs.version }}.jar build/release/
          cp build/libs/dragsimutils-${{ steps.info.outputs.version }}-sources.jar build/release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dragsimutils-${{ steps.info.outputs.version }}-${{ steps.info.outputs.short }}
          if-no-files-found: error
          path: build/release/*

  release:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dragsimutils-${{ needs.build.outputs.version }}-${{ needs.build.outputs.short }}
          path: dist
      - name: Publish GitHub release
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          MOD_VERSION: ${{ needs.build.outputs.version }}
          COMMIT_SHORT: ${{ needs.build.outputs.short }}
        with:
          script: |
            const fs = require('fs');
            const version = process.env.MOD_VERSION;
            const short = process.env.COMMIT_SHORT;
            const tag = `${version}-${short}`;
            const files = [`dragsimutils-${version}.jar`, `dragsimutils-${version}-sources.jar`];
            const changelog = fs.readFileSync('CHANGELOG.md', 'utf8');
            const marker = `## ${version}`;
            const start = changelog.indexOf(marker);
            const notes = start < 0 ? '' : changelog.slice(start + marker.length).split('\n## ')[0].trim();
            const body = `${notes}\n\n### Requirements\nMinecraft **26.1.2**, Fabric Loader **0.19.1+**, Fabric API **0.155.0+ for 26.1.2**, Java **25+**.\n\nInstall the regular jar in your Fabric instance's mods folder. Updates are installed manually.\n\nBuilt by GitHub from commit [\`${short}\`](https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${context.sha}).`;
            const releases = await github.paginate(github.rest.repos.listReleases, {...context.repo, per_page: 100});
            let release = releases.find(r => r.tag_name === tag);
            if (release && !release.draft) {
              core.info(`Release ${tag} is already published.`);
              return;
            }
            if (!release) {
              release = (await github.rest.repos.createRelease({...context.repo, tag_name: tag,
                target_commitish: context.sha, name: `Dragsim Utils ${version}`, body, draft: true})).data;
            }
            for (const asset of release.assets) {
              await github.rest.repos.deleteReleaseAsset({...context.repo, asset_id: asset.id});
            }
            for (const file of files) {
              await github.rest.repos.uploadReleaseAsset({...context.repo, release_id: release.id,
                headers: {'content-type': 'application/java-archive',
                  'content-length': fs.statSync(`dist/${file}`).size},
                name: file, data: fs.readFileSync(`dist/${file}`)});
            }
            await github.rest.repos.updateRelease({...context.repo, release_id: release.id,
              draft: false, make_latest: 'true'});
